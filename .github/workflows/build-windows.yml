name: Build Windows exe

# Builds ShareWebAndFiles.exe on a real Windows machine (GitHub's
# windows-latest runner) and attaches it to the run as a downloadable
# artifact. Useful if you don't have a Windows PC handy to run
# PyInstaller on yourself.
#
# Put this file at: .github/workflows/build-windows.yml in your repo,
# alongside app.py, ui.py, core.py, requirements.txt,
# ShareWebAndFiles.spec and version_info.txt.
#
# Then: push to GitHub -> open the "Actions" tab -> open the run ->
# download the "ShareWebAndFiles-windows" artifact (a zip containing
# the exe + its _internal folder). You can also trigger it manually
# from the Actions tab ("Run workflow") without pushing anything new.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller ShareWebAndFiles.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShareWebAndFiles-windows
          path: dist/ShareWebAndFiles/
          if-no-files-found: error
